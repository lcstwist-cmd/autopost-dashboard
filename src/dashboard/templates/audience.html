<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audience Tracker — AutoPost</title>
<script src="/static/tailwind.js"></script>
<style>
  :root {
    --bg:      #020806;
    --surface: rgba(4,13,7,.95);
    --border:  rgba(0,255,120,.1);
    --border-h:rgba(0,255,120,.38);
    --neon:    #00ff7a;
    --green:   #22c55e;
    --cyan:    #06d6a0;
    --text:    #dff7e8;
    --muted:   #3d7a55;
    --dim:     #1a3d26;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
  }
  body::after {
    content:''; position:fixed; inset:0;
    background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0,255,120,.04) 0%, transparent 70%);
    pointer-events:none; z-index:0;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    backdrop-filter: blur(12px);
  }
  .card:hover { border-color: rgba(0,255,120,.22); }

  h1, h2, h3 { color: var(--text); }
  .neon { color: var(--neon); }
  .muted { color: var(--muted); }

  .btn {
    background: linear-gradient(135deg, var(--neon), var(--cyan));
    color: #000; font-weight: 700; padding: .5rem 1rem;
    border-radius: 8px; border: 0; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(0,255,120,.35); }
  .btn-ghost {
    background: transparent; color: var(--text);
    border: 1px solid var(--border-h); padding: .35rem .75rem;
    border-radius: 8px; font-size: .85rem; cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--neon); color: var(--neon); }

  input[type="text"], input[type="url"] {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border-h);
    border-radius: 8px; padding: .55rem .75rem;
    width: 100%;
  }
  input:focus { outline: none; border-color: var(--neon); }

  .bar {
    background: linear-gradient(90deg, var(--cyan), var(--neon));
    height: 8px; border-radius: 4px;
    transition: width .3s ease;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: .55rem .75rem; text-align: left;
            border-bottom: 1px solid rgba(0,255,120,.06); }
  th { color: var(--muted); font-weight: 500; font-size: .85rem;
        text-transform: uppercase; letter-spacing: .05em; }
  tr:hover td { background: rgba(0,255,120,.03); }
  code.short {
    background: var(--bg); border: 1px solid var(--border);
    padding: 2px 6px; border-radius: 4px; font-size: .85rem;
    color: var(--cyan);
  }
  .pill {
    display: inline-block; padding: 2px 8px;
    border-radius: 12px; font-size: .7rem;
    background: rgba(0,255,120,.08); color: var(--cyan);
  }
  nav a { color: var(--text); padding: 8px 16px; border-radius: 8px; }
  nav a:hover { background: rgba(0,255,120,.06); }
  nav a.active { color: var(--neon); }
</style>
</head>
<body class="relative">

<nav class="relative z-10 px-6 py-3 flex gap-2 border-b border-[rgba(0,255,120,.06)]">
  <a href="/">← Dashboard</a>
  <a href="/audience" class="active">Audience</a>
  <a href="/competitor-tracker">Competitors</a>
  <a href="/settings">Settings</a>
  <span class="ml-auto muted text-sm py-2">{{ user.email }}</span>
</nav>

<main class="relative z-10 max-w-6xl mx-auto p-6 space-y-6">

  <header class="flex items-end justify-between flex-wrap gap-4">
    <div>
      <h1 class="text-3xl font-bold neon">Audience Tracker</h1>
      <p class="muted">Vezi de unde vin click-urile pe link-urile tale (ipstack-powered).</p>
    </div>
    <div class="flex gap-2 items-center">
      <label class="muted text-sm">Perioada:</label>
      <select id="days" class="card px-3 py-2 text-sm">
        <option value="7">7 zile</option>
        <option value="30" selected>30 zile</option>
        <option value="90">90 zile</option>
        <option value="365">1 an</option>
      </select>
    </div>
  </header>

  <!-- Country breakdown -->
  <section class="card p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold">Top țări</h2>
      <span id="totalClicks" class="pill">0 click-uri</span>
    </div>
    <div id="countries" class="space-y-3">
      <p class="muted text-sm">Se încarcă…</p>
    </div>
  </section>

  <!-- Create new shortlink -->
  <section class="card p-6">
    <h2 class="text-xl font-semibold mb-4">Creează shortlink nou</h2>
    <div class="grid md:grid-cols-3 gap-3">
      <input id="newUrl" type="url" placeholder="https://news.example.com/article-123"
             class="md:col-span-2">
      <input id="newLabel" type="text" placeholder="Etichetă (opțional)">
    </div>
    <div class="mt-3 flex justify-end">
      <button class="btn" onclick="createLink()">Generează</button>
    </div>
    <div id="lastCreated" class="mt-3"></div>
  </section>

  <!-- Existing shortlinks list -->
  <section class="card p-6">
    <h2 class="text-xl font-semibold mb-4">Link-urile tale</h2>
    <div class="overflow-x-auto">
      <table id="linksTable">
        <thead>
          <tr>
            <th>Cod</th><th>Etichetă</th><th>Platform</th>
            <th class="text-right">Click-uri</th>
            <th>Țintă</th><th></th>
          </tr>
        </thead>
        <tbody id="linksBody">
          <tr><td colspan="6" class="muted">Se încarcă…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

async function loadBreakdown() {
  const days = $('days').value;
  const r = await fetch(`/api/audience/breakdown?days=${days}`);
  if (!r.ok) return;
  const data = await r.json();
  const total = data.total_clicks || 0;
  $('totalClicks').textContent = total + ' click-uri';
  const wrap = $('countries');
  if (!data.countries || !data.countries.length) {
    wrap.innerHTML = '<p class="muted text-sm">Niciun click înregistrat încă. Distribuie un shortlink ca să vezi date aici.</p>';
    return;
  }
  const top = data.countries[0].hits || 1;
  wrap.innerHTML = data.countries.map(c => {
    const pct = total > 0 ? Math.round((c.hits / total) * 100) : 0;
    const w   = Math.round((c.hits / top) * 100);
    return `
      <div>
        <div class="flex justify-between text-sm mb-1">
          <span><b>${c.country_name}</b> <span class="muted">${c.country_code}</span></span>
          <span class="muted">${c.hits} click (${pct}%)</span>
        </div>
        <div class="bar" style="width: ${w}%"></div>
      </div>`;
  }).join('');
}

async function loadLinks() {
  const r = await fetch('/api/shortlinks');
  if (!r.ok) return;
  const data = await r.json();
  const tbody = $('linksBody');
  if (!data.shortlinks || !data.shortlinks.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="muted">Niciun shortlink încă. Creează primul mai sus, sau publishhul îl va crea automat când postezi cu URL.</td></tr>';
    return;
  }
  tbody.innerHTML = data.shortlinks.map(l => `
    <tr>
      <td><code class="short">${l.code}</code></td>
      <td>${escapeHtml(l.label || '—')}</td>
      <td>${escapeHtml(l.platform || '—')}</td>
      <td class="text-right neon font-bold">${l.click_count}</td>
      <td class="muted text-sm">${escapeHtml((l.target_url || '').slice(0, 50))}…</td>
      <td class="text-right">
        <button class="btn-ghost" onclick="copyShort('${l.short_url}')">Copy</button>
        <button class="btn-ghost" onclick="del(${l.id})">×</button>
      </td>
    </tr>`).join('');
}

async function createLink() {
  const target_url = $('newUrl').value.trim();
  const label      = $('newLabel').value.trim();
  if (!target_url) { alert('URL gol'); return; }
  const r = await fetch('/api/shortlink', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({target_url, label, platform: 'manual'})
  });
  if (!r.ok) { alert('Eroare: ' + (await r.text())); return; }
  const data = await r.json();
  $('lastCreated').innerHTML =
    `<div class="card p-3 flex items-center gap-3">
       <code class="short">${data.short_url}</code>
       <button class="btn-ghost" onclick="copyShort('${data.short_url}')">Copy</button>
     </div>`;
  $('newUrl').value = ''; $('newLabel').value = '';
  loadLinks();
}

async function del(id) {
  if (!confirm('Șterge linkul + tot istoricul de click-uri?')) return;
  await fetch('/api/shortlink/' + id, {method: 'DELETE'});
  loadLinks();
  loadBreakdown();
}

function copyShort(u) {
  navigator.clipboard.writeText(u);
  const note = document.createElement('div');
  note.textContent = 'Copiat: ' + u;
  note.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#000;border:1px solid var(--neon);color:var(--neon);padding:10px 14px;border-radius:8px;z-index:99';
  document.body.appendChild(note);
  setTimeout(() => note.remove(), 2000);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('days').addEventListener('change', loadBreakdown);
loadBreakdown();
loadLinks();
</script>
</body>
</html>
