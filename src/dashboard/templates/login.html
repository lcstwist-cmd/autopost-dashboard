<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMD AutoPost — Sign In</title>
<script src="/static/tailwind.js"></script>
<link rel="stylesheet" href="/static/elite.css">
<style>
body {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden;
}
.login-wrap {
  width: 100%; max-width: 420px;
  padding: 24px; position: relative; z-index: 1;
}
.login-card {
  background: rgba(4,13,7,.97);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 38px 34px;
  position: relative; overflow: hidden;
  box-shadow: 0 0 60px rgba(0,255,120,.07), 0 0 120px rgba(0,255,120,.03);
  backdrop-filter: blur(20px);
}
.login-card::before {
  content: '';
  position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,255,120,.45), transparent);
}
.login-card::after {
  content: '';
  position: absolute; inset: 0; border-radius: var(--r-xl);
  background: linear-gradient(135deg, rgba(0,255,120,.03) 0%, transparent 50%);
  pointer-events: none;
}

/* Logo pulse */
@keyframes logo-pulse {
  0%,100% { filter: drop-shadow(0 0 16px rgba(0,255,120,.5)); }
  50%      { filter: drop-shadow(0 0 28px rgba(0,255,120,.8)); }
}
.logo-glow { animation: logo-pulse 3s ease infinite; }

/* Pulse dots */
@keyframes dot-pulse { 0%,80%,100%{transform:scale(.5);opacity:.5;} 40%{transform:scale(1);opacity:1;} }
.pdot { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--neon); margin:0 2px; }
.pdot:nth-child(1){animation:dot-pulse 1.2s .0s ease infinite;}
.pdot:nth-child(2){animation:dot-pulse 1.2s .2s ease infinite;}
.pdot:nth-child(3){animation:dot-pulse 1.2s .4s ease infinite;}

input[type=email], input[type=password] {
  background: rgba(5,10,20,.95);
  border: 1px solid var(--border);
  color: var(--text); border-radius: var(--r-sm);
  padding: 12px 16px; width: 100%; font-size: 13px;
  transition: border-color .2s, box-shadow .2s; outline: none;
  font-family: inherit;
}
input:focus {
  border-color: rgba(0,255,120,.42);
  box-shadow: 0 0 0 3px rgba(0,255,120,.06);
}
input::placeholder { color: var(--muted); }

.btn-submit {
  background: linear-gradient(135deg, #065c28, #16a34a);
  color: #fff; border: none; border-radius: var(--r-md);
  padding: 13px; font-weight: 800; font-size: 14px;
  width: 100%; cursor: pointer; letter-spacing: .03em;
  transition: all .2s; box-shadow: 0 2px 20px rgba(22,163,74,.25);
  position: relative; overflow: hidden;
}
.btn-submit:hover {
  box-shadow: 0 4px 32px rgba(0,255,120,.4);
  transform: translateY(-1px);
}
.btn-submit::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
  transform: translateX(-100%); transition: transform .4s;
}
.btn-submit:hover::after { transform: translateX(100%); }
</style>
</head>
<body>
<div class="grid-floor" aria-hidden="true"></div>

<div class="login-wrap">

  <!-- Logo block -->
  <div class="text-center mb-8">
    <div class="logo-glow inline-block">
      <div class="elite-logo" style="font-size:38px;letter-spacing:.06em;">EMD</div>
    </div>
    <div class="elite-logo-tag" style="font-size:10px;letter-spacing:.2em;margin-top:4px;">AutoPost AI Platform</div>
    <div class="flex justify-center items-center gap-1 mt-3">
      <span class="pdot"></span><span class="pdot"></span><span class="pdot"></span>
    </div>
  </div>

  <div class="login-card">
    <h2 style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:24px;letter-spacing:.02em;">
      Sign in to Command Center
    </h2>

    {% if error %}
    <div class="ealert-err text-sm mb-5">⚠ {{ error }}</div>
    {% endif %}

    <form method="post" action="/login" style="display:flex;flex-direction:column;gap:16px;">
      <div>
        <label class="elabel">Email</label>
        <input type="email" name="email" required autofocus placeholder="you@example.com">
      </div>
      <div>
        <label class="elabel">Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit" style="margin-top:6px;">Sign In →</button>
    </form>

    <div class="edivider"></div>

    <p class="text-center text-xs" style="color:var(--muted);">
      No account?
      <a href="/register" style="color:var(--neon);font-weight:700;text-decoration:none;">Request Access →</a>
    </p>
  </div>

  <p class="text-center mt-5" style="font-size:10px;color:var(--dim);letter-spacing:.05em;">
    EliteMarginDesk © 2026 · Social Media AI Automation
  </p>

</div>
</body>
</html>
